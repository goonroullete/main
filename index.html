<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roulette Aggregator Pro</title>
    <style>
        body { font-family: system-ui, sans-serif; background-color: #0f0f13; color: #e0e0e0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        /* Header & Nav */
        .header-container { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;}
        h1 { margin: 0; font-size: 1.8rem; }
        .header-buttons { display: flex; gap: 10px; }
        .menu-btn { background: #2a2a3a; color: #aaa; border: 1px solid #444; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; font-weight: bold; }
        .menu-btn:hover { background: #e91e63; color: white; border-color: #e91e63; }
        .menu-btn.fav { background: #3a2a00; color: #ffd700; border-color: #ffd700; }
        .menu-btn.fav:hover { background: #ffd700; color: black; }

        /* Navigation Tabs */
        .tabs { display: flex; gap: 15px; margin-bottom: 20px; background: #1a1a24; padding: 10px; border-radius: 12px; flex-wrap: wrap; justify-content: center; width: 100%; max-width: 800px; box-sizing: border-box; }
        .tab { padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .tab.active { background: #e91e63; color: white; }
        .tab:hover:not(.active) { background: #2a2a3a; }

        /* Controls */
        .controls { margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center;}
        input, select, button { padding: 10px 16px; font-size: 1rem; border-radius: 6px; border: 1px solid #333; background: #1e1e1e; color: white; }
        input { width: 200px; }
        select { cursor: pointer; background: #2a2a3a; }
        button.spin-btn { background-color: #e91e63; border: none; cursor: pointer; font-weight: bold; }
        button.spin-btn:hover { background-color: #d81b60; }
        
        /* Video Player */
        .video-container { width: 100%; max-width: 800px; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.6); margin-bottom: 15px; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Video Details */
        .video-header { display: flex; justify-content: center; align-items: center; gap: 15px; max-width: 800px; margin-bottom: 5px; width: 100%; }
        #videoTitle { font-size: 1.1rem; text-align: center; font-weight: bold; }
        .fav-star { font-size: 1.5rem; cursor: pointer; color: #555; transition: transform 0.2s; user-select: none; }
        .fav-star:hover { transform: scale(1.2); }
        .fav-star.active { color: #ffd700; text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        
        #videoSource { font-size: 0.9rem; color: #888; margin-bottom: 15px; text-align: center; }
        
        /* Tags */
        .video-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 800px; margin-bottom: 20px; }
        .vid-tag-chip { background: #333; border: 1px solid #555; padding: 4px 10px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; }
        .vid-tag-chip:hover { background: #d32f2f; border-color: #ff5252; }
        .vid-tag-chip:hover::after { content: " (Ban)"; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 100; padding: 20px; box-sizing: border-box;}
        .modal-content { background: #1e1e24; padding: 25px; border-radius: 12px; width: 100%; max-width: 600px; border: 1px solid #333; max-height: 80vh; display: flex; flex-direction: column; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-header h2 { margin: 0; font-size: 1.4rem; }
        .close-btn { background: none; border: none; color: #aaa; font-size: 1.5rem; cursor: pointer; }
        .close-btn:hover { color: white; }
        
        .blacklist-grid { display: flex; gap: 8px; flex-wrap: wrap; overflow-y: auto; }
        .blacklisted-chip { background: #4a0000; border: 1px solid #ff5252; color: #ffcccc; padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; }
        .blacklisted-chip:hover { background: #1a1a24; border-color: #444; color: #aaa; text-decoration: line-through; }
        
        /* Favorites List */
        .favorites-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
        .fav-item { display: flex; justify-content: space-between; align-items: center; background: #2a2a3a; padding: 10px 15px; border-radius: 8px; border: 1px solid #444; }
        .fav-info { display: flex; flex-direction: column; cursor: pointer; flex-grow: 1; }
        .fav-title { font-weight: bold; font-size: 0.95rem; margin-bottom: 4px; color: #fff;}
        .fav-meta { font-size: 0.8rem; color: #aaa; }
        .fav-info:hover .fav-title { color: #e91e63; }
        .fav-remove { background: none; border: none; color: #ff5252; cursor: pointer; font-size: 1.2rem; padding: 5px; }
        .fav-remove:hover { color: #ff0000; transform: scale(1.1); }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>🎲 Multi-Site Roulette</h1>
        <div class="header-buttons">
            <button class="menu-btn fav" onclick="openModal('favoritesModal')">⭐ Favorites</button>
            <button class="menu-btn" onclick="openModal('blacklistModal')">🚫 Blacklist</button>
        </div>
    </div>

    <!-- Categories -->
    <div class="tabs">
        <div class="tab active" onclick="switchCategory('jav', this)">JAV</div>
        <div class="tab" onclick="switchCategory('hentai', this)">Animations</div>
        <div class="tab" onclick="switchCategory('homemade amateur', this)">Homemade Amateur</div>
    </div>

    <!-- Search & Controls -->
    <div class="controls">
        <input type="text" id="tagInput" placeholder="Enter search tag..." value="jav">
        <select id="durationSelect">
            <option value="any">Any Length</option>
            <option value="short">Short (Under 5m)</option>
            <option value="normal">Normal (5m - 30m)</option>
            <option value="long">Long (30m+)</option>
        </select>
        <button class="spin-btn" onclick="fetchAndSpin()">SPIN 🎰</button>
    </div>

    <div class="video-container">
        <iframe id="player" src="" allowfullscreen></iframe>
    </div>
    
    <div class="video-header">
        <div id="videoTitle">Loading...</div>
        <div class="fav-star" id="starBtn" onclick="toggleFavorite()" title="Save to Favorites">☆</div>
    </div>
    <div id="videoSource"></div>
    <div class="video-tags" id="videoTagsContainer"></div>

    <!-- Blacklist Modal -->
    <div id="blacklistModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Banned Tags</h2>
                <button class="close-btn" onclick="closeModal('blacklistModal')">&times;</button>
            </div>
            <p style="font-size: 0.9rem; color: #888; margin-bottom: 15px;">Click a tag to remove it from the blacklist.</p>
            <div class="blacklist-grid" id="blacklistGrid"></div>
        </div>
    </div>

    <!-- Favorites Modal -->
    <div id="favoritesModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>⭐ Saved Videos</h2>
                <button class="close-btn" onclick="closeModal('favoritesModal')">&times;</button>
            </div>
            
            <!-- NEW WARNING MESSAGE HERE -->
            <div style="background: #2a2a3a; border-left: 4px solid #e91e63; padding: 10px 15px; border-radius: 4px; font-size: 0.85rem; color: #ccc; margin-bottom: 15px; display: flex; align-items: center; gap: 10px;">
                <span>⚠️</span>
                <span><strong>Note:</strong> Favorites are saved locally to this device's browser. They will not sync if you open this site on a different phone or computer.</span>
            </div>

            <div class="favorites-list" id="favoritesList"></div>
        </div>
    </div>

    <script>
        // --- GLOBAL STATE ---
        let currentVideo = null; 

        // --- DATABASES (LocalStorage) ---
        let bannedTags = JSON.parse(localStorage.getItem('roulette_blacklist')) || [];
        let savedFavorites = JSON.parse(localStorage.getItem('roulette_favorites')) || [];

        // --- MODAL LOGIC ---
        function openModal(id) { 
            document.getElementById(id).style.display = 'flex'; 
            if(id === 'blacklistModal') renderBlacklistModal();
            if(id === 'favoritesModal') renderFavoritesModal();
        }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // --- BLACKLIST SYSTEM ---
        function saveBlacklist() { localStorage.setItem('roulette_blacklist', JSON.stringify(bannedTags)); renderBlacklistModal(); }
        function banTag(tag) {
            const cleanTag = tag.toLowerCase().trim();
            if (!bannedTags.includes(cleanTag)) {
                bannedTags.push(cleanTag);
                saveBlacklist();
                fetchAndSpin(); 
            }
        }
        function unbanTag(tag) { bannedTags = bannedTags.filter(t => t !== tag); saveBlacklist(); }
        function renderBlacklistModal() {
            const grid = document.getElementById('blacklistGrid');
            if (bannedTags.length === 0) { grid.innerHTML = "<span style='color: #666;'>No tags blacklisted yet.</span>"; return; }
            grid.innerHTML = bannedTags.map(tag => `<div class="blacklisted-chip" onclick="unbanTag('${tag}')">${tag} &times;</div>`).join('');
        }

        // --- FAVORITES SYSTEM ---
        function saveFavoritesDB() { localStorage.setItem('roulette_favorites', JSON.stringify(savedFavorites)); }
        
        function toggleFavorite() {
            if (!currentVideo) return;
            const existsIndex = savedFavorites.findIndex(v => v.embed === currentVideo.embed);
            
            if (existsIndex > -1) {
                // Remove it
                savedFavorites.splice(existsIndex, 1);
            } else {
                // Add it
                savedFavorites.push(currentVideo);
            }
            saveFavoritesDB();
            updateStarUI();
            renderFavoritesModal();
        }

        function updateStarUI() {
            if (!currentVideo) return;
            const star = document.getElementById('starBtn');
            const isFav = savedFavorites.some(v => v.embed === currentVideo.embed);
            if (isFav) {
                star.innerHTML = "★";
                star.classList.add('active');
            } else {
                star.innerHTML = "☆";
                star.classList.remove('active');
            }
        }

        function removeFavorite(embedUrl, event) {
            event.stopPropagation(); // Prevents the video from playing when you click the trash can
            savedFavorites = savedFavorites.filter(v => v.embed !== embedUrl);
            saveFavoritesDB();
            updateStarUI();
            renderFavoritesModal();
        }

        function playFavorite(index) {
            currentVideo = savedFavorites[index];
            loadVideoIntoPlayer();
            closeModal('favoritesModal');
        }

        function renderFavoritesModal() {
            const list = document.getElementById('favoritesList');
            if (savedFavorites.length === 0) { 
                list.innerHTML = "<span style='color: #666; text-align:center; padding: 20px;'>No videos saved yet. Click the ☆ to save one!</span>"; 
                return; 
            }
            list.innerHTML = savedFavorites.map((vid, index) => `
                <div class="fav-item">
                    <div class="fav-info" onclick="playFavorite(${index})">
                        <div class="fav-title">${vid.title}</div>
                        <div class="fav-meta">${vid.source} • ${formatSecondsToMMSS(vid.durationSec)}</div>
                    </div>
                    <button class="fav-remove" onclick="removeFavorite('${vid.embed}', event)" title="Remove">🗑️</button>
                </div>
            `).join('');
        }

        // --- UTILITIES ---
        function extractTags(vidObj, apiType) {
            let tags = [];
            try {
                if (apiType === 'EPorner' && vidObj.keywords) tags = vidObj.keywords.split(',').map(t => t.trim());
                else if (vidObj.tags) tags = vidObj.tags.map(t => t.tag_name || t.name || t).filter(Boolean);
            } catch(e) {}
            return tags.map(t => t.toLowerCase());
        }
        function parseDurationToSeconds(val) {
            if (!val) return 0;
            if (typeof val === 'number') return val;
            if (!isNaN(val)) return parseInt(val, 10);
            const parts = val.toString().split(':').map(Number);
            if (parts.length === 3) return (parts[0] * 3600) + (parts[1] * 60) + parts[2];
            if (parts.length === 2) return (parts[0] * 60) + parts[1];
            return 0;
        }
        function formatSecondsToMMSS(seconds) {
            if (seconds === 0) return "Unknown";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        /* --- API FETCHERS --- */
        async function getEPorner(tag) {
            try {
                const res = await fetch(`https://www.eporner.com/api/v2/video/search/?query=${encodeURIComponent(tag)}&format=json&per_page=30`);
                const data = await res.json();
                return data.videos ? data.videos.map(v => ({ title: v.title, embed: `https://www.eporner.com/embed/${v.id}/`, source: 'EPorner', tags: extractTags(v, 'EPorner'), durationSec: parseDurationToSeconds(v.length_sec || v.length_min) })) : [];
            } catch (e) { return []; }
        }
        async function getRedTube(tag) {
            try {
                const res = await fetch(`https://api.redtube.com/?data=redtube.Videos.searchVideos&search=${encodeURIComponent(tag)}&output=json`);
                const data = await res.json();
                return data.videos ? data.videos.map(v => ({ title: v.video.title, embed: v.video.embed_url, source: 'RedTube', tags: extractTags(v.video, 'RedTube'), durationSec: parseDurationToSeconds(v.video.duration) })) : [];
            } catch (e) { return []; }
        }
        async function getPornhub(tag) {
            try {
                const res = await fetch(`https://www.pornhub.com/webmasters/search?search=${encodeURIComponent(tag)}`);
                const data = await res.json();
                return data.videos ? data.videos.map(v => ({ title: v.title, embed: v.embed || `https://www.pornhub.com/embed/${v.video_id}`, source: 'Pornhub', tags: extractTags(v, 'Pornhub'), durationSec: parseDurationToSeconds(v.duration) })) : [];
            } catch (e) { return []; }
        }
        async function getYouPorn(tag) {
            try {
                const res = await fetch(`https://www.youporn.com/api/webmasters/search?search=${encodeURIComponent(tag)}`);
                const data = await res.json();
                const vids = data.videos || data.video;
                return vids ? vids.map(v => ({ title: v.title, embed: v.embed, source: 'YouPorn', tags: extractTags(v, 'YouPorn'), durationSec: parseDurationToSeconds(v.duration) })) : [];
            } catch (e) { return []; }
        }
        async function getTube8(tag) {
            try {
                const res = await fetch(`https://api.tube8.com/api.php?action=searchVideos&q=${encodeURIComponent(tag)}&output=json`);
                const data = await res.json();
                return data.videos ? data.videos.map(v => ({ title: v.video.title, embed: v.video.embed_url, source: 'Tube8', tags: extractTags(v.video, 'Tube8'), durationSec: parseDurationToSeconds(v.video.duration) })) : [];
            } catch (e) { return []; }
        }

        // Category Switcher
        function switchCategory(mainTag, element) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            document.getElementById('tagInput').value = mainTag;
            fetchAndSpin();
        }

        /* --- UI UPDATER --- */
        function loadVideoIntoPlayer() {
            if (!currentVideo) return;
            const formattedTime = formatSecondsToMMSS(currentVideo.durationSec);
            
            document.getElementById('player').src = currentVideo.embed;
            document.getElementById('videoTitle').innerText = currentVideo.title;
            document.getElementById('videoSource').innerText = `Source: ${currentVideo.source} | Duration: ${formattedTime}`;
            
            // Render clickable tags
            if (currentVideo.tags && currentVideo.tags.length > 0) {
                document.getElementById('videoTagsContainer').innerHTML = currentVideo.tags.map(tag => 
                    `<div class="vid-tag-chip" onclick="banTag('${tag}')">${tag}</div>`
                ).join('');
            } else {
                document.getElementById('videoTagsContainer').innerHTML = "<span style='color:#666; font-size:0.8rem;'>No tags provided</span>";
            }

            updateStarUI();
        }

        /* --- CORE LOGIC --- */
        async function fetchAndSpin() {
            const searchTag = document.getElementById('tagInput').value.trim();
            const durationPref = document.getElementById('durationSelect').value;
            if (!searchTag) return;

            document.getElementById('videoTitle').innerText = "Scouring APIs & Filtering...";
            document.getElementById('videoSource').innerText = "";
            document.getElementById('videoTagsContainer').innerHTML = "";
            document.getElementById('starBtn').classList.remove('active');
            document.getElementById('starBtn').innerHTML = "☆";

            const results = await Promise.all([
                getEPorner(searchTag), getRedTube(searchTag), getPornhub(searchTag), getYouPorn(searchTag), getTube8(searchTag)
            ]);

            let combinedVideos = results.flat();

            // FILTER 1: Blacklisted Tags
            if (bannedTags.length > 0) {
                combinedVideos = combinedVideos.filter(video => {
                    if (!video.tags || video.tags.length === 0) return true;
                    return !video.tags.some(t => bannedTags.includes(t));
                });
            }

            // FILTER 2: Duration
            if (durationPref !== 'any') {
                combinedVideos = combinedVideos.filter(v => {
                    if (v.durationSec === 0) return false; 
                    if (durationPref === 'short') return v.durationSec <= 300; 
                    if (durationPref === 'normal') return v.durationSec > 300 && v.durationSec <= 1800; 
                    if (durationPref === 'long') return v.durationSec > 1800; 
                    return true;
                });
            }

            if (combinedVideos.length === 0) {
                document.getElementById('videoTitle').innerText = "No videos found matching your criteria.";
                return;
            }

            // Pick a random video & store it globally
            const randomIndex = Math.floor(Math.random() * combinedVideos.length);
            currentVideo = combinedVideos[randomIndex];

            loadVideoIntoPlayer();
        }

        window.onload = () => { fetchAndSpin(); };
    </script>
</body>
</html>
